
[build]
  publish = "."
  command = ""

# SPA (Single Page Application) yo'naltirishlarini sozlash
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Browser xavfsizligi va kesh sozlamalari
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    # SharedArrayBuffer va boshqa zamonaviy APIlar uchun zarur
    Cross-Origin-Opener-Policy = "same-origin"
    Cross-Origin-Embedder-Policy = "require-corp"
